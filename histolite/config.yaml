name: "HistoLite"
description: >
  Gestione intelligente della storia dei sensori Home Assistant.
  Analizza i sensori con più dati registrati e applica strategie di
  purge mirato o appiattimento statistico per alleggerire il database SQLite.
version: "2.1.0"
slug: "histolite"
init: false
homeassistant_api: false
auth_api: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:database-clock"
panel_title: "HistoLite"

arch:
  - aarch64
  - amd64

options:
  db_type: "sqlite"
  db_path: "/config/home-assistant_v2.db"
  db_url: ""
  db_host: ""
  db_port: 3306
  db_user: ""
  db_password: ""
  db_name: ""
  log_level: "info"
  max_rows_per_batch: 5000

schema:
  db_type: list(sqlite|postgresql|mariadb)
  db_path: str
  db_url: str?
  db_host: str?
  db_port: int?
  db_user: str?
  db_password: str?
  db_name: str?
  log_level: list(debug|info|warning|error)
  max_rows_per_batch: int

map:
  - config:rw
  - ssl:ro

ports:
  8099/tcp: null

ports_description:
  8099/tcp: "Interfaccia web HistoLite (Ingress)"
